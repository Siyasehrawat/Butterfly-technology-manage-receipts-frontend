name: Manage_Receipt
description: Manage Receipt App - AI Receipt Scanner & Expense Tracker to scan, track & organize receipts. Smart, fast & free expense management
publish_to: 'none'
version: 3.2.12+34

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  jwt_decoder: ^2.0.1
  http: ^1.1.0
  encrypt: ^5.0.3
  provider: ^6.0.5
  shared_preferences: ^2.2.0
  image_picker: ^1.0.4
  photo_view: ^0.14.0
  intl: ^0.18.1
  logger: ^2.0.1
  flutter_svg: ^2.0.7
  path_provider: ^2.1.1
  flutter_secure_storage: ^9.0.0
  url_launcher: ^6.2.1
  cached_network_image: ^3.3.0
  flutter_native_splash: ^2.3.2
  flutter_launcher_icons: ^0.13.1
  universal_html: ^2.2.4
  image_picker_web: ^3.1.1
  url_strategy: ^0.2.0
  flutter_web_plugins:
    sdk: flutter
  geolocator: 9.0.2
  geocoding: ^2.1.0
  camera: ^0.10.6
  fl_chart: ^0.65.0
  flutter_exif_rotation: ^0.5.2
  permission_handler: ^11.0.1
  device_info_plus: ^11.4.0
  file_picker: ^10.1.9
  syncfusion_flutter_pdfviewer: ^29.2.7
  geolocator_apple: 2.3.0
  share_plus: ^7.2.1
  flutter_dotenv:
  package_info_plus: ^8.0.0
  purchases_flutter: ^8.10.5
  purchases_ui_flutter: ^8.10.5
  firebase_core: ^3.15.2
  firebase_messaging: ^15.2.10
  flutter_local_notifications: ^19.4.0
  js: ^0.6.7
  _flutterfire_internals: ^1.3.59
  connectivity_plus: ^6.1.4
  connectivity_plus_platform_interface: ^2.0.1
  webview_flutter: ^4.4.2
  webview_flutter_android: ^3.12.1
  webview_flutter_wkwebview: ^3.9.4
  google_sign_in: ^6.2.1
  flutter_facebook_auth: ^7.1.1
  sign_in_with_apple: ^6.1.0
  flutter_facebook_auth_web: ^6.1.2
  google_sign_in_web: ^0.12.0
  google_fonts: ^6.1.0
  
  # Share intent functionality
  dio: ^5.3.2



dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#7E5EFD"
  adaptive_icon_foreground: "assets/icon/app_icon.png"
  web:
    generate: true
    image_path: "assets/icon/app_icon.png"
  windows:
    generate: true
    image_path: "assets/icon/app_icon.png"
  macos:
    generate: true
    image_path: "assets/icon/app_icon.png"
flutter_native_splash:
  color: "#7E5EFD"
  image: "assets/icon/app_icon.png"
  android: true
  ios: true
  web: false

flutter:
  uses-material-design: true
  assets:
    - assets/apple.png
    - assets/google.png
    - assets/manual.png
    - assets/offline.png
    - assets/coin.png
    - assets/coinshower.png
    - assets/icon/
    - .env



